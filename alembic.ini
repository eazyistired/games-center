# Used for local development only (e.g. `alembic revision --autogenerate -m "..."`).
# In the container, migrations run automatically on startup (app/migrate.py).
[alembic]
prepend_sys_path = .
script_location = app/migrations
sqlalchemy.url = sqlite:///data/games.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
